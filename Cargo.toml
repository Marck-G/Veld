
[workspace]
resolver="3"
members = ["crates/*" ]

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.6"
semver = {version = "1.0.27", features = ["serde"]}
owo-colors = "4.3.0"
rstest = "0.26.1"
veld-error = {path="./crates/veld-error"}
reqwest = {version ="0.13.2", features = ["blocking"]}
git2 = "0.20.4"

